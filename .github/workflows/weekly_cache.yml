name: Weekly Cache Pre-Generation

on:
  schedule:
    - cron: '30 4 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pregenerate-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHubDev Engine Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Sunday Batch Cache Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
        run: |
          python -m src.publisher --batch-cache

      - name: Commit Pre-Generated Lesson Cache to Engine Repo
        run: |
          git config --global user.name "GitHubDev Automation Bot"
          git config --global user.email "githubdev-bot@users.noreply.github.com"
          git add cache/
          if ! git diff --staged --quiet; then
            git commit -m "chore(cache): pre-generate 7-day lesson batch [skip ci]"
            git push origin main
          fi
