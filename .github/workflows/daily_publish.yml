name: Daily Lesson Publishing

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-lesson:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHubDev Engine Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Publisher Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT || vars.GH_PAT }}
        run: |
          python -m src.publisher

      - name: Commit & Push Updated Progress State to Engine Repo
        run: |
          git config --global user.name "GitHubDev Automation Bot"
          git config --global user.email "githubdev-bot@users.noreply.github.com"
          git add state/progress.json logs/ cache/ backup/
          if ! git diff --staged --quiet; then
            git commit -m "chore(engine): update progress state and logs after daily publish [skip ci]"
            git push origin main
          fi
