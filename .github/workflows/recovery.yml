name: Recovery & Retry Pipeline

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC (Retry fallback check)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recovery-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHubDev Engine Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Recovery Attempt
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT || vars.GH_PAT }}
        run: |
          python -m src.publisher

      - name: Commit Recovery State Changes
        run: |
          git config --global user.name "GitHubDev Automation Bot"
          git config --global user.email "githubdev-bot@users.noreply.github.com"
          git add state/progress.json backup/ logs/
          if ! git diff --staged --quiet; then
            git commit -m "fix(recovery): state updated following recovery retry [skip ci]"
            git push origin main
          fi
